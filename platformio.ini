[platformio]
default_envs = arduino_nano

[env:arduino_nano]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200
upload_protocol = arduino
upload_speed = 115200
lib_deps =
  paulstoffregen/OneWire@^2.3.8
  milesburton/DallasTemperature@^3.11.0
  https://github.com/coryjfowler/MCP_CAN_lib
; The Nano is full. These keep the firmware inside its 30,720 bytes of flash and 2 KB of
; RAM: no function inlining (inlining everything into loop() cost about 3 KB), shared
; function entry/exit code, short jumps where they reach, and small serial buffers
; (nothing is read from serial; the buffers are RAM). Add -DNANO_VERBOSE_SERIAL=1 for
; the long diagnostics only on a board with more memory.
build_flags =
  -DCCM_CAN_PROTOCOL_VERSION=2
  -DCCM_CAN_SPEED=CAN_500KBPS
  -DCCM_MCP2515_CLOCK=MCP_8MHZ
  -I ../../shared/can_contract/include
  -fno-inline-functions
  -fno-inline-small-functions
  -fno-inline-functions-called-once
  -mcall-prologues
  -Wl,--relax
  -DSERIAL_RX_BUFFER_SIZE=16
  -DSERIAL_TX_BUFFER_SIZE=32
build_src_filter =
  +<*>
  -<knock_detector_logic.cpp>
  -<knock_filter.cpp>
  -<knock_monitor.cpp>
  -<knock_sampler.cpp>
  -<knock_ui.cpp>
  -<main_esp32.cpp>
  -<adc_sampler.cpp>
  +<main_nano.cpp>
  +<sensors_nano.cpp>

; ESP32-S3 DevKitC-1 board that replaces the Nano (docs/ESP32_HARDWARE.md): the pump on
; a MOSFET with PWM, boost and RPM from the ECU's CAN broadcast, and new firmware from
; the dash over CAN. Pick this environment in the PlatformIO toolbar to build it.
[env:esp32s3_water_meth]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
build_type = release
monitor_speed = 115200
upload_speed = 921600
lib_ldf_mode = chain
lib_deps =
  autowp/autowp-mcp2515@1.3.1
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D CORE_DEBUG_LEVEL=0
  -DCCM_CAN_PROTOCOL_VERSION=2
build_src_filter =
  -<*>
  +<main_esp32.cpp>
  +<adc_sampler.cpp>
  +<injection_controller.cpp>
  +<app_config.cpp>
