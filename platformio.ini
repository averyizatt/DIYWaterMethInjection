[env:arduino_nano]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200
upload_protocol = arduino
upload_speed = 115200
lib_deps =
  paulstoffregen/OneWire@^2.3.8
  milesburton/DallasTemperature@^3.11.0
  https://github.com/coryjfowler/MCP_CAN_lib
build_flags =
  -DCCM_CAN_PROTOCOL_VERSION=1
  -I ../../shared/can_contract/include
build_src_filter =
  +<*>
  -<knock_detector_logic.cpp>
  -<knock_filter.cpp>
  -<knock_monitor.cpp>
  -<knock_sampler.cpp>
  -<knock_ui.cpp>
  +<main_nano.cpp>
  +<sensors_nano.cpp>

[env:arduino_nano_old_bootloader]
extends = env:arduino_nano
upload_speed = 57600

[env:native_knock_tests]
platform = native
test_filter = test_knock_detector
build_src_filter =
  -<*>
  +<knock_filter.cpp>
  +<knock_detector_logic.cpp>
test_build_src = yes
build_flags =
  -I include

[env:native_injection_tests]
platform = native
test_filter = test_injection_controller
build_src_filter =
  -<*>
  +<injection_controller.cpp>
test_build_src = yes
build_flags =
  -I include
