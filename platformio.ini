[platformio]
default_envs = arduino_nano

[env:arduino_nano]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200
upload_protocol = arduino
upload_speed = 115200
lib_deps =
  paulstoffregen/OneWire@^2.3.8
  milesburton/DallasTemperature@^3.11.0
  https://github.com/coryjfowler/MCP_CAN_lib
build_flags =
  -DCCM_CAN_PROTOCOL_VERSION=2
  -DCCM_CAN_SPEED=CAN_500KBPS
  -DCCM_MCP2515_CLOCK=MCP_8MHZ
  -I ../../shared/can_contract/include
build_src_filter =
  +<*>
  -<knock_detector_logic.cpp>
  -<knock_filter.cpp>
  -<knock_monitor.cpp>
  -<knock_sampler.cpp>
  -<knock_ui.cpp>
  +<main_nano.cpp>
  +<sensors_nano.cpp>
