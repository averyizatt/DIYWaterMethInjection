[platformio]
default_envs = esp32s3_water_meth

; ESP32-S3 DevKitC-1 water/meth board (docs/ESP32_HARDWARE.md): the pump on a MOSFET, full
; on or off in timed pulses, boost and RPM from the ECU's CAN broadcast, and new firmware
; from the dash over CAN. The bench test environments follow it.
[env:esp32s3_water_meth]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
build_type = release
monitor_speed = 115200
upload_speed = 921600
lib_ldf_mode = chain
lib_deps =
  autowp/autowp-mcp2515@1.3.1
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D CORE_DEBUG_LEVEL=0
  -DCCM_CAN_PROTOCOL_VERSION=2
  ; Connects the framework's crash hook (set_arduino_panic_handler), which switches the
  ; pump off at a crash before the report and core dump are written. The Arduino IDE
  ; links with this; PlatformIO does not, and without it the hook is silently never called.
  -Wl,--wrap=esp_panic_handler
build_src_filter =
  -<*>
  +<main_esp32.cpp>
  +<adc_sampler.cpp>
  +<injection_controller.cpp>
  +<app_config.cpp>

; Bench test for the pump's MOSFET driver, and nothing else (src/pump_test_esp32.cpp):
; pump off for 10 s after start-up, then 10 % more duty every 2 s up to 100 %, then off.
; Same pin (GPIO15) and PWM frequency as the real firmware. Flash the environment above
; again afterwards.
[env:esp32s3_pump_test]
platform = ${env:esp32s3_water_meth.platform}
board = esp32-s3-devkitc-1
framework = arduino
build_type = release
monitor_speed = 115200
upload_speed = 921600
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D CORE_DEBUG_LEVEL=0
build_src_filter =
  -<*>
  +<pump_test_esp32.cpp>

; Bench test for the knock amplifier and its X9C104 gain potentiometer, and nothing else
; (src/knock_gain_test_esp32.cpp): steps the gain through its range and prints what the
; ADC hears at each stop. Flash esp32s3_water_meth again afterwards.
; It also puts a steady knock-frequency test tone on GPIO38, to feed the amplifier in place
; of the sensor: GPIO38 - 10k - the sensor's signal wire, 1k from there to ground (see the
; top of the source). -D KNOCK_GAIN_TEST_TONE_PIN=-1 turns it off.
[env:esp32s3_knock_gain_test]
platform = ${env:esp32s3_water_meth.platform}
board = esp32-s3-devkitc-1
framework = arduino
build_type = release
monitor_speed = 115200
upload_speed = 921600
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D CORE_DEBUG_LEVEL=0
  -D KNOCK_GAIN_TEST_TONE_PIN=38
build_src_filter =
  -<*>
  +<knock_gain_test_esp32.cpp>
  +<adc_sampler.cpp>

; Knock test with the amplifier on fixed resistors (gain jumpers, no potentiometer), and
; nothing else (src/knock_test_esp32.cpp): the real firmware's knock listening, with a
; plain-language report on the serial monitor every 2 s, a line for every loud burst
; and the spectrum every 10 s. Knock input GPIO1. Change the gain jumper's value below
; or type "g 3.2" in the monitor. Flash esp32s3_water_meth again afterwards.
[env:esp32s3_knock_test]
platform = ${env:esp32s3_water_meth.platform}
board = esp32-s3-devkitc-1
framework = arduino
build_type = release
monitor_speed = 115200
upload_speed = 921600
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D CORE_DEBUG_LEVEL=0
  -D KNOCK_TEST_GAIN=2.0f
build_src_filter =
  -<*>
  +<knock_test_esp32.cpp>
  +<adc_sampler.cpp>

; Bench test for the tank float switch (GPIO7) and the intake air temperature sensors
; (GPIO5 or GPIO6 for one before-nozzle sensor), and nothing else (src/inputs_test_esp32.cpp):
; the firmware's own readings printed every second, and a line whenever the float switch
; changes. Flash esp32s3_water_meth again afterwards.
[env:esp32s3_inputs_test]
platform = ${env:esp32s3_water_meth.platform}
board = esp32-s3-devkitc-1
framework = arduino
build_type = release
monitor_speed = 115200
upload_speed = 921600
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D CORE_DEBUG_LEVEL=0
build_src_filter =
  -<*>
  +<inputs_test_esp32.cpp>
  +<adc_sampler.cpp>

; Bench test of what happens when the firmware fails (src/main_esp32.cpp with
; METH_SAFETY_TEST): the real firmware, plus serial commands that make it fail on purpose,
; one way at a time - s: the main loop stalls; h: the main loop hangs; c: the CAN task
; hangs; x: a crash; i: a core stuck with interrupts off; f: clear faults; ?: the list.
; Each failure starts with the pump output at 30 %: have nothing on it, or no fluid.
; Flash esp32s3_water_meth again afterwards. Never for the car.
[env:esp32s3_safety_test]
extends = env:esp32s3_water_meth
build_flags =
  ${env:esp32s3_water_meth.build_flags}
  -D METH_SAFETY_TEST=1
