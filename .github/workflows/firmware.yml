# Runs the host tests and builds the ESP32-S3 firmware and its bench tests on every
# change. The firmware image is published as the "watermeth-latest" release: the dash
# downloads it during Update now and installs it over the CAN bus (docs/ESP32_HARDWARE.md).
name: Firmware

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'include/**'
      - 'test/**'
      - 'tools/**'
      - 'platformio.ini'
      - 'platformio-tests.ini'
      - '.github/workflows/firmware.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firmware
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The shared CAN contract is read from DIYComfortControlModule, checked out next to this repository.
      - uses: actions/checkout@v4
        with:
          fetch-tags: true
          path: DIYWaterMethInjection
      - uses: actions/checkout@v4
        with:
          repository: averyizatt/DIYComfortControlModule
          path: DIYComfortControlModule

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-water-meth-${{ hashFiles('DIYWaterMethInjection/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Host tests
        working-directory: DIYWaterMethInjection
        run: |
          # Two commands, not "g++ ... && test": under bash -e a test that no longer compiled
          # would then be skipped without failing the run.
          for name in test_meth_tune test_meth_pulse test_esp32_inputs test_reset_guard test_black_box test_status_light test_knock_agc test_knock_dsp test_knock_spectrum test_pcb test_ecu_profiles; do
            g++ -std=c++11 -O2 -Wall -I include test/$name/test_main.cpp -o /tmp/$name
            /tmp/$name
          done
          # The LTspice replay tool uses the firmware's own headers: it must keep building.
          g++ -std=c++11 -O2 -Wall -I include test/test_injection_controller/test_main.cpp src/injection_controller.cpp src/app_config.cpp -o /tmp/test_injection_controller
          /tmp/test_injection_controller
          g++ -std=c++17 -O2 -Wall -I include tools/ltspice/ltreplay.cpp -o /tmp/ltreplay

      # The PCB web page's live preview (GitHub Pages) is built from include/web_ui.h and the
      # settings headers: it must be regenerated when they change.
      - name: Web page preview is current
        working-directory: DIYWaterMethInjection
        run: python tools/web_ui_preview.py --check

      # The image is copied out at once: the next build runs with other flags, and
      # PlatformIO then clears the build folder.
      - name: Build the bench tests
        working-directory: DIYWaterMethInjection
        run: pio run -e WaterMethPrototypeV2-PumpTest -e WaterMethPrototypeV2-KnockGainTest -e WaterMethPrototypeV2-KnockTest -e WaterMethPrototypeV2-InputsTest -e WaterMethPrototypeV2-SafetyTest

      # Knock listening is off in the published firmware for now (ESP32_KNOCK, the owner's
      # choice until the amplifier works on the bench). It is built here with knock on as
      # well, so the code keeps compiling while it is off. Not published.
      - name: Build the ESP32-S3 firmware with knock on
        working-directory: DIYWaterMethInjection
        run: PLATFORMIO_BUILD_FLAGS="-DESP32_KNOCK=1" pio run -e WaterMethPrototypeV2

      # The build number the controller reports to the dash: the first eight hex digits of the commit.
      - name: Build the ESP32-S3 firmware
        working-directory: DIYWaterMethInjection
        run: |
          BUILD=$(git rev-parse HEAD | cut -c1-8)
          # The system version (VERSION, shared by the dash and every module): exactly it on its
          # release tag, with a + after it for a build that came later.
          V=$(tr -cd '0-9.' < VERSION)
          if git tag --points-at HEAD | grep -qx "v$V"; then echo "RELEASE=$V" >> "$GITHUB_ENV"; else echo "RELEASE=$V+" >> "$GITHUB_ENV"; fi
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          PLATFORMIO_BUILD_FLAGS="-DMETH_FW_BUILD=0x$BUILD" pio run -e WaterMethPrototypeV2

      - name: Package
        working-directory: DIYWaterMethInjection
        run: |
          mkdir -p out
          cp .pio/build/WaterMethPrototypeV2/firmware.bin out/watermeth-firmware.bin
          python3 - <<'EOF'
          import hashlib, json, os, pathlib
          data = pathlib.Path('out/watermeth-firmware.bin').read_bytes()
          assert 0 < len(data) <= 0x330000, len(data)   # Must fit one application slot.
          manifest = {'build': os.environ['BUILD'], 'size': len(data),
                      'sha256': hashlib.sha256(data).hexdigest(), 'commit': os.environ['GITHUB_SHA'],
                      'version': os.environ.get('RELEASE', '')}
          pathlib.Path('out/watermeth-firmware.json').write_text(json.dumps(manifest) + '\n')
          print(manifest)
          EOF

      # The PCB's two builds (docs/PCB.md). Copied out at once, like the prototype's image.
      - name: Build the PCB firmware
        working-directory: DIYWaterMethInjection
        run: |
          for env in WaterMethPCBFrogDash WaterMethPCBStandalone; do
            PLATFORMIO_BUILD_FLAGS="-DMETH_FW_BUILD=0x$BUILD" pio run -e $env
            cp .pio/build/$env/firmware.bin out/$env.bin
          done
          # Each image must carry its own board mark (pcb_board.h) and not the other's:
          # firmware arriving without its mark is refused, so a mix-up is never installed.
          grep -qa WMPCB-REVD-FROGDASH-IMAGE out/WaterMethPCBFrogDash.bin && ! grep -qa WMPCB-REVD-STANDALONE-IMAGE out/WaterMethPCBFrogDash.bin
          grep -qa WMPCB-REVD-STANDALONE-IMAGE out/WaterMethPCBStandalone.bin && ! grep -qa WMPCB-REVD-FROGDASH-IMAGE out/WaterMethPCBStandalone.bin
          ! grep -qa WMPCB-REVD out/watermeth-firmware.bin

      - uses: actions/upload-artifact@v4
        with:
          name: water-meth-firmware
          path: DIYWaterMethInjection/out/

      # The image goes up before its manifest: the dash only takes an image that matches the manifest it read.
      - name: Publish
        working-directory: DIYWaterMethInjection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view watermeth-latest >/dev/null 2>&1 || gh release create watermeth-latest \
            --title "Water/meth ESP32 firmware (latest build)" --latest=false \
            --notes "Built automatically from main, for the ESP32-S3 board. The dash downloads this during Update now and installs it over the CAN bus."
          gh release upload watermeth-latest out/watermeth-firmware.bin --clobber
          gh release upload watermeth-latest out/watermeth-firmware.json --clobber
          # The PCB's images go to a release of their own, never watermeth-latest: the dash
          # sends watermeth-latest to the prototype board in the car.
          gh release view watermeth-pcb-latest >/dev/null 2>&1 || gh release create watermeth-pcb-latest             --title "Water/meth PCB firmware (latest build)" --latest=false             --notes "Built automatically from main, for the water/meth controller PCB (rev D, XIAO ESP32-S3). WaterMethPCBStandalone.bin: any car, set up from a phone over the board's Wi-Fi. WaterMethPCBFrogDash.bin: for a Frogdash dash. Flash by USB the first time (docs/PCB.md)."
          gh release upload watermeth-pcb-latest out/WaterMethPCBFrogDash.bin out/WaterMethPCBStandalone.bin --clobber
